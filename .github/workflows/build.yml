name: Build Jarvis Android APK

# Verify that the debug signing key survives between workflow runs (cache persistence check).
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android debug signing key
        run: |
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore Android debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: jarvis-android-debug-keystore-v1

      - name: Check AndroidManifest XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8-sig").lstrip()
          path.write_text(content, encoding="utf-8")
          ET.parse(path)
          print("AndroidManifest.xml valid")
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --info

      - name: Save Android debug signing key
        uses: actions/cache/save@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: jarvis-android-debug-keystore-v1

      - name: Print debug APK SHA-1 for Firebase
        run: |
          echo "Debug APK signing certificate fingerprint:"
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
