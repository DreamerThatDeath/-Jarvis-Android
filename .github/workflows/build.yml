
name: Build Jarvis Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check AndroidManifest XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8-sig").lstrip()
          path.write_text(content, encoding="utf-8")
          ET.parse(path)
          print("AndroidManifest.xml valid")
          PY


      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --info
        
      - name: Print debug APK SHA-1 for Firebase
        run: |
          echo "Debug APK signing certificate fingerprint:"
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
